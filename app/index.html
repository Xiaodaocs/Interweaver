<!DOCTYPE html>
<html data-theme="light" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>交织者 Interweaver · P1–P6 原型</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- 顶部菜单栏（⑦）：取代原左上角标题块；原来的右上角选项并入其右侧 -->
<div id="menubar">
  <div class="mbLeft">
    <div class="mbMenu" data-menu="file">
      <button class="mbTop" data-mbtop="file">文件</button>
      <div class="mbDrop">
        <button data-act="file:new">新建</button>
        <button data-act="file:open">打开…</button>
        <button data-act="file:save">保存</button>
        <button data-act="file:saveas">另存为…</button>
      </div>
    </div>
    <div class="mbMenu" data-menu="edit">
      <button class="mbTop" data-mbtop="edit">编辑</button>
      <div class="mbDrop">
        <button data-act="edit:undo">撤销</button>
        <button data-act="edit:redo">重做</button>
      </div>
    </div>
    <div class="mbMenu" data-menu="settings">
      <button class="mbTop" data-mbtop="settings">设置</button>
    </div>
  </div>
  <div class="mbRight">
    <button id="audioBtn" title="环境音（默认开启，点击可关）">♫</button>
    <button id="themeBtn" title="主题（深/浅/跟随系统）">◐</button>
    <button id="sceneBtn" title="场景（保存 / 载入）">▤</button>
    <button id="achBtn" title="知识网（成就）">✦</button>
    <button id="helpBtn" title="验收清单">?</button>
  </div>
</div>

<!-- 底部工具条（用户要求 ①②③）：预设库单独一组在左，8 个工具在右（坐标系替换了预设库的位置） -->
<div id="dockBar">
  <button id="presetBtn" data-tool="presets" title="预设库 (M)"><svg viewBox="0 0 24 24"><path d="M3 14c2-8 4 6 6-2s4 6 6 0 3 4 6-2"/></svg></button>
  <div id="toolbar">
    <button data-tool="select" class="on" title="选择/拖动 (V)"><svg viewBox="0 0 24 24"><path d="M6 3l14 9-6 1.5L11 20z"/></svg></button>
    <button data-tool="point" title="点 (P)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg></button>
    <button data-tool="segment" title="线段 (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="2.4" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="2.4" fill="currentColor" stroke="none"/></svg></button>
    <button data-tool="circle" title="圆 (C)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
    <button data-tool="freehand" title="画笔 (B)"><svg viewBox="0 0 24 24"><path d="M4 17c3-6 5 2 8-4s4 3 8-5"/></svg></button>
    <button data-tool="angle" title="角度（从一条线拖到另一条线）"><svg viewBox="0 0 24 24"><path d="M3 19h18M3 19L17 6"/><path d="M10.5 19a9 9 0 0 0-1.7-5.2"/></svg></button>
    <button data-tool="coordsys" title="坐标系（为图形建立独立参考系）"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 16h8M8 12h12M12 8v8"/></svg></button>
    <button data-tool="fx" title="函数生成器 (F)"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 8 3-8h4M9 20c1-4 2-6 3-8"/></svg></button>
  </div>
</div>

<!-- 预设抽屉 -->
<div id="presetDock" class="win" data-slide="left" hidden></div>

<!-- 函数创作器（左下角弹出） -->
<div id="fxDock" class="win" data-slide="up" hidden></div>

<!-- 变量窗口（右下角，可拖可缩） -->
<div id="varWin" class="win">
  <div class="winBar" data-winbar>
    <span class="winTitle">变量与观察器</span>
  </div>
  <div class="winBody" id="varWinBody"></div>
</div>

<!-- 设置卡（正下方中间，不覆盖右下变量区） -->
<div id="setCard" class="win">
  <div class="winBar" data-winbar>
    <span class="winTitle">设置</span>
    <span class="winBtns">
    </span>
  </div>
  <div class="winBody">
    <label class="setRow"><input type="checkbox" id="setParams" checked> 显示所有参数</label>
    <label class="setRow"><input type="checkbox" id="setConn"> 连接视图（Tab）</label>
    <label class="setRow"><input type="checkbox" id="setSfx"> 音效</label>
  </div>
</div>

<!-- 左上角操作弹窗（用户要求 ⑥）：关联/约束/角/坐标系等单卡片操作统一在这里进行，不用时收回 -->
<div id="opPop" class="win" data-slide="tl" hidden>
  <div class="winBar" data-winbar>
    <span class="winTitle" id="opTitle">操作</span>
    <span class="winBtns"><button id="opClose" title="收起">×</button></span>
  </div>
  <div class="winBody" id="opPopBody"></div>
</div>

<!-- 右侧面板：只剩属性（没有选中实体时整块缩回） -->
<div id="panel">
  <div id="panelTabs">
    <button data-tab="props" class="on">属性</button>
  </div>
  <div id="panelBody"></div>
</div>

<!-- 底部：提示 + 缩放 -->
<div id="hint"></div>
<div id="zoomLabel">100%</div>
<div id="fpsLabel" hidden></div>

<!-- 右键菜单 -->
<div id="ctxMenu" hidden></div>

<!-- 验收清单 -->
<div id="checklist" class="win" hidden>
  <div class="winBar" data-winbar>
    <span class="winTitle">手动验收清单</span>
    <span class="winBtns">
      <button id="clClose" title="关闭">×</button>
    </span>
  </div>
  <div class="cl-body" id="clBody"></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
