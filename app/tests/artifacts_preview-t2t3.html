const tiers = {"1":{"id":1,"name":"火种","shape":"circle","size":46,"rings":0,"pulses":1},"2":{"id":2,"name":"结构","shape":"square","size":52,"rings":1,"pulses":2},"3":{"id":3,"name":"交织","shape":"hex","size":58,"rings":2,"pulses":3}};

}
